name: observability-demo

networks:
  obs:
    driver: bridge

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: obs-nginx
    depends_on:
      - grafana
      - prometheus
      - loki
      - tempo
      - alloy
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    environment:
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER:-}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD:-}
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./config/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [obs]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: obs-grafana
    depends_on:
      - loki
      - tempo
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}:${PUBLIC_PORT:-8080}/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [obs]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: obs-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [obs]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: obs-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [obs]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: obs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.external-url=/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [obs]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: obs-alloy
    depends_on:
      - loki
      - tempo
      - prometheus
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # OTLP for apps on the host / other compose networks via host publish
      - "4317:4317"
      - "4318:4318"
    networks: [obs]
    restart: unless-stopped

  # App mate — smoke test de logs + métricas + trazas
  #   docker compose --profile mate up -d --build
  mate:
    profiles: ["mate"]
    build: ./mate
    container_name: obs-mate
    depends_on:
      - alloy
    labels:
      obs.enabled: "true"
    environment:
      SERVICE_NAME: mate
      INSTANCE_ID: "1"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      MATE_AUTO_TRAFFIC: "true"
      MATE_INTERVAL_MS: "3000"
    ports:
      - "4000:4000"
    networks: [obs]
    restart: unless-stopped
