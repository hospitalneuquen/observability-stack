worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  # Docker DNS — re-resolve upstreams when containers restart
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # ---- Grafana (primary UI for developers) ----
    location / {
      set $grafana grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://$grafana;
    }

    # ---- Prometheus UI ----
    location /prometheus/ {
      auth_basic           "Observability demo";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $prometheus prometheus:9090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /prometheus;
      rewrite ^/prometheus/?(.*)$ /$1 break;
      proxy_pass http://$prometheus;
    }

    # ---- Loki API / UI-ish ----
    location /loki/ {
      auth_basic           "Observability demo";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $loki loki:3100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite ^/loki/?(.*)$ /$1 break;
      proxy_pass http://$loki;
    }

    # ---- Tempo ----
    location /tempo/ {
      auth_basic           "Observability demo";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $tempo tempo:3200;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite ^/tempo/?(.*)$ /$1 break;
      proxy_pass http://$tempo;
    }

    # ---- Alloy UI ----
    location /alloy/ {
      auth_basic           "Observability demo";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $alloy alloy:12345;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite ^/alloy/?(.*)$ /$1 break;
      proxy_pass http://$alloy;
    }

    # Health for the edge proxy itself
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
