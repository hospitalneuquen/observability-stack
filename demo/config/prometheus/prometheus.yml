global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service_name: prometheus

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service_name: alloy

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service_name: loki

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service_name: tempo

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service_name: grafana
